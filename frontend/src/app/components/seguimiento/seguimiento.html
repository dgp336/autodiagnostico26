<section class="seguimiento-shell">
  <header class="seguimiento-head">
    <h1>Seguimiento</h1>
    <p>Estado de reparación y comunicación directa.</p>
  </header>

  <mat-horizontal-stepper
    #stepper
    [linear]="false"
    [class.seguimiento-stepper--readonly]="!canEditTracking">

    <mat-step
      label="Cita Agendada"
      [completed]="issueStatus === 'IN WORKSHOP' || issueStatus === 'IN PROGRESS' || issueStatus === 'FIXED'"
      [editable]="canEditTracking">
      <p>Cita Agendada</p>
    </mat-step>

    <mat-step
      label="En Revisión"
      [completed]="issueStatus === 'IN PROGRESS' || issueStatus === 'FIXED'"
      [editable]="canEditTracking">
      <p>En Revisión</p>
    </mat-step>

    <mat-step label="Reparado" [completed]="issueStatus === 'FIXED'" [editable]="false">
      <p>Reparado</p>
    </mat-step>

  </mat-horizontal-stepper>

  <div class="seguimiento-content">

    @if (hasTracking) {

    <router-outlet />

    } @else {

    <div class="seguimiento-empty">

      <h3>No tienes seguimiento de un coche activo</h3>

      <p>
        Todavía no has elegido a un mecánico para tu coche.
      </p>

    </div>
    }

  </div>
</section>
